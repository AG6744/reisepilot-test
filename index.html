<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<title>ReisePilot Test</title>
<style>body{font-family:system-ui;margin:0;background:#f1f5f9;color:#0f172a}.app{max-width:720px;margin:auto;padding:16px}.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}button,input,select{font:inherit}input,select{width:100%;box-sizing:border-box;padding:12px;margin:5px 0 12px;border:1px solid #cbd5e1;border-radius:12px}button{border:0;border-radius:12px;padding:13px 16px;background:#2563eb;color:white;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:white;color:#0f172a;border:1px solid #e2e8f0}.muted{color:#64748b;font-size:14px}#msg{font-weight:650}@media(max-width:420px){.grid{grid-template-columns:1fr}}</style>
</head><body><main class="app"><h1>ReisePilot</h1><p class="muted">Mobiler Testbetrieb v0.1</p><div class="grid"><button class="tile" type="button">+ Neue Fahrt</button><button class="tile" type="button">📷 Beleg</button><button class="tile" type="button">⛽ Tanken</button><button class="tile" type="button">📊 Auswertung</button></div><section class="card"><h2>Neue Fahrt</h2><form id="f"><label>Datum<input id="date" type="date" required></label><label>Typ<select id="type"><option>Geschäftlich</option><option>Privat</option></select></label><label>Start<input id="start" required></label><label>Ziel<input id="ziel" required></label><label>Kilometer<input id="km" type="number" min="1" max="3000" required></label><label>Zweck<input id="purpose"></label><button>Prüfen & lokal speichern</button></form><p id="msg" aria-live="polite"></p></section><section class="card"><h2>Teststatus</h2><p id="count">0 Fahrten lokal auf diesem Gerät gespeichert.</p><button id="clear" type="button">Testdaten löschen</button></section></main><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');const k='reisepilot-trips';const trips=()=>JSON.parse(localStorage.getItem(k)||'[]');const update=()=>document.querySelector('#count').textContent=trips().length+' Fahrten lokal auf diesem Gerät gespeichert.';document.querySelector('#f').addEventListener('submit',e=>{e.preventDefault();const type=document.querySelector('#type').value,purpose=document.querySelector('#purpose').value.trim(),km=Number(document.querySelector('#km').value);const msg=document.querySelector('#msg');if(type==='Geschäftlich'&&!purpose){msg.textContent='Fehler: Bei Geschäftsfahrten ist ein Zweck erforderlich.';return}if(km<1||km>3000){msg.textContent='Fehler: Kilometer müssen zwischen 1 und 3.000 liegen.';return}const a=trips();a.push({id:crypto.randomUUID?.()||Date.now().toString(),date:date.value,type,start:start.value,ziel:ziel.value,km,purpose,created:new Date().toISOString()});localStorage.setItem(k,JSON.stringify(a));msg.textContent='Fahrt wurde lokal gespeichert.';e.target.reset();update()});document.querySelector('#clear').addEventListener('click',()=>{localStorage.removeItem(k);update();document.querySelector('#msg').textContent='Testdaten gelöscht.'});update();</script></body></html>
