<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>ReisePilot Test v0.2</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#172033; background:#f4f7fb; }
    body { margin:0; }
    main { max-width:760px; margin:auto; padding:18px; }
    .card { background:#fff; border:1px solid #dce3ee; border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:0 3px 14px rgba(15,23,42,.05); }
    h1,h2 { margin-top:0; }
    label { display:block; font-weight:650; margin:12px 0 5px; }
    input,select { width:100%; box-sizing:border-box; padding:12px; border:1px solid #bdc9d8; border-radius:10px; font-size:16px; }
    button { border:0; border-radius:10px; padding:12px 15px; font-size:16px; font-weight:700; cursor:pointer; }
    .primary { background:#2563eb; color:white; }
    .secondary { background:#e8eef7; color:#172033; }
    .danger { background:#b91c1c; color:white; }
    .row { display:flex; gap:10px; flex-wrap:wrap; }
    .status { padding:10px 12px; border-radius:10px; background:#eef3f8; margin-top:12px; white-space:pre-wrap; }
    .trip { border-top:1px solid #e3e8ef; padding:12px 0; }
    .muted { color:#667085; font-size:14px; }
    .hidden { display:none; }
    @media (prefers-color-scheme: dark) {
      :root { color:#e5e7eb; background:#0f172a; }
      .card { background:#172033; border-color:#334155; }
      input,select { background:#0f172a; color:#fff; border-color:#475569; }
      .secondary,.status { background:#29364b; color:#fff; }
      .muted { color:#aab5c5; }
    }
  </style>
</head>
<body>
<main>
  <h1>ReisePilot <span class="muted">v0.2 Test</span></h1>

  <section id="loginCard" class="card">
    <h2>Anmeldung</h2>
    <label for="email">E-Mail</label>
    <input id="email" type="email" autocomplete="username">
    <label for="password">Passwort</label>
    <input id="password" type="password" autocomplete="current-password">
    <div class="row" style="margin-top:14px">
      <button id="loginBtn" class="primary" type="button">Anmelden</button>
    </div>
    <div id="loginStatus" class="status" aria-live="polite">Noch nicht angemeldet.</div>
  </section>

  <section id="appCard" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center">
        <div><strong id="userLabel">Angemeldet</strong><div id="syncStatus" class="muted">Synchronisation bereit</div></div>
        <button id="logoutBtn" class="secondary" type="button">Abmelden</button>
      </div>
    </div>

    <div class="card">
      <h2>Neue Fahrt</h2>
      <form id="tripForm">
        <label for="tripDate">Datum</label>
        <input id="tripDate" type="date" required>
        <label for="tripType">Fahrttyp</label>
        <select id="tripType"><option value="business">Geschäftlich</option><option value="private">Privat</option></select>
        <label for="startLocation">Start</label>
        <input id="startLocation" required placeholder="z. B. Deggendorf">
        <label for="destination">Ziel</label>
        <input id="destination" required placeholder="z. B. Passau">
        <label for="purpose">Fahrtzweck</label>
        <input id="purpose" placeholder="z. B. Kundentermin">
        <label for="distanceKm">Kilometer</label>
        <input id="distanceKm" type="number" min="0.1" max="3000" step="0.1" required>
        <div class="row" style="margin-top:14px"><button class="primary" type="submit">Fahrt speichern</button><button id="reloadBtn" class="secondary" type="button">Neu laden</button></div>
      </form>
      <div id="formStatus" class="status" aria-live="polite">Bereit.</div>
    </div>

    <div class="card">
      <h2>Meine Fahrten</h2>
      <div id="tripList" class="muted">Noch keine Daten geladen.</div>
    </div>
  </section>
</main>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const CONFIG={url:'https://qefdkfozbllkpvwrhgcm.supabase.co',key:'sb_publishable_2adWwMGhlk0LGnJXw0drHg_4RH-hSd9'};
  const supabase = createClient(CONFIG.url, CONFIG.key, { auth: { persistSession:true, autoRefreshToken:true } });

  const $ = id => document.getElementById(id);
  function msg(id,text) { $(id).textContent=text; }
  function setView(session) {
    const loggedIn=!!session;
    $('loginCard').classList.toggle('hidden',loggedIn);
    $('appCard').classList.toggle('hidden',!loggedIn);
    if(loggedIn) $('userLabel').textContent=session.user.email || 'Angemeldet';
  }

  async function loadTrips() {
    msg('syncStatus','Synchronisiere ...');
    const { data,error }=await supabase.from('trips').select('id,trip_date,start_location,destination,purpose,trip_type,distance_km,status,updated_at').order('trip_date',{ascending:false}).order('created_at',{ascending:false});
    if(error) { msg('syncStatus','Fehler beim Laden'); msg('tripList',error.message); return; }
    msg('syncStatus','Synchronisiert');
    if(!data?.length) { msg('tripList','Noch keine Fahrten in Supabase.'); return; }
    $('tripList').innerHTML=data.map(t=>`<div class="trip"><strong>${escapeHtml(t.trip_date)} · ${escapeHtml(t.start_location)} → ${escapeHtml(t.destination)}</strong><br>${escapeHtml(String(t.distance_km))} km · ${t.trip_type==='business'?'Geschäftlich':'Privat'}${t.purpose?' · '+escapeHtml(t.purpose):''}<br><span class="muted">Status: ${escapeHtml(t.status)}</span></div>`).join('');
  }
  function escapeHtml(v) { return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }

  $('loginBtn').addEventListener('click',async()=>{
    const email=$('email').value.trim(), password=$('password').value;
    if(!email||!password) return msg('loginStatus','Bitte E-Mail und Passwort eingeben.');
    msg('loginStatus','Anmeldung läuft ...');
    const { data,error }=await supabase.auth.signInWithPassword({email,password});
    if(error) return msg('loginStatus','Anmeldung fehlgeschlagen: '+error.message);
    setView(data.session); await loadTrips();
  });

  $('logoutBtn').addEventListener('click',async()=>{ await supabase.auth.signOut(); setView(null); msg('loginStatus','Abgemeldet.'); });
  $('reloadBtn').addEventListener('click',loadTrips);

  $('tripForm').addEventListener('submit',async(e)=>{
    e.preventDefault();
    const { data:{ user } }=await supabase.auth.getUser();
    if(!user) return msg('formStatus','Nicht angemeldet.');
    const type=$('tripType').value, purpose=$('purpose').value.trim(), km=Number($('distanceKm').value);
    if(type==='business'&&!purpose) return msg('formStatus','Bei einer Geschäftsfahrt ist ein Fahrtzweck erforderlich.');
    if(!Number.isFinite(km)||km<=0||km>3000) return msg('formStatus','Kilometer müssen größer als 0 und höchstens 3000 sein.');
    const record={user_id:user.id,trip_date:$('tripDate').value,start_location:$('startLocation').value.trim(),destination:$('destination').value.trim(),purpose:purpose||null,trip_type:type,distance_km:km,status:'draft'};
    if(!record.trip_date||!record.start_location||!record.destination) return msg('formStatus','Bitte Datum, Start und Ziel ausfüllen.');
    msg('formStatus','Speichere in Supabase ...');
    const { error }=await supabase.from('trips').insert(record);
    if(error) return msg('formStatus','Fehler: '+error.message);
    msg('formStatus','Gespeichert und synchronisiert.');
    e.target.reset(); $('tripDate').value=new Date().toISOString().slice(0,10); await loadTrips();
  });

  if('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  $('tripDate').value=new Date().toISOString().slice(0,10);
  const { data:{ session } }=await supabase.auth.getSession();
  setView(session); if(session) await loadTrips();
  supabase.auth.onAuthStateChange((_event,session)=>setView(session));
</script>
</body>
</html>
